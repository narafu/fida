services:
  fida:
    image: ${FIDA_IMAGE:?FIDA_IMAGE is required}
    container_name: fida
    env_file: .env
    volumes:
      - ./secrets:/secrets:ro
      - ./.fida-state:/state
    depends_on:
      playwright-server:
        condition: service_healthy
    expose: ["7070"]
    mem_limit: 1536m   # 호스트 6GB 보호 — 평시 ~360MiB, JVM 힙은 MaxRAMPercentage=75%로 이 한도 기준
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7070/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  playwright-server:
    image: ${PLAYWRIGHT_SERVER_IMAGE:?PLAYWRIGHT_SERVER_IMAGE is required}
    container_name: fida-playwright-server
    environment:
      FANDING_EMAIL: ${FANDING_EMAIL}
      FANDING_PASSWORD: ${FANDING_PASSWORD}
    mem_limit: 3g   # 호스트 6GB 보호 — 스크롤 제거 후 Chromium 피크 ~1.2GiB 실측(이전 무한 스크롤 시 ~1.8GiB로 1536m 제한에서 OOM, 2026-10-31)
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  caddy:
    image: caddy:2.9-alpine   # 버전 핀 — 무빙 태그 방지
    container_name: fida-caddy
    environment:
      FIDA_DOMAIN: ${FIDA_DOMAIN}   # env_file(.env 전체 주입) 대신 필요한 값만 — GEMINI_API_KEY 등 secret이 리버스 프록시 컨테이너에 노출되지 않도록
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 64m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
