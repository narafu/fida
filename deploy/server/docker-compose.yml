services:
  fida:
    image: ${FIDA_IMAGE:?FIDA_IMAGE is required}
    container_name: fida
    env_file: .env
    volumes:
      - ./secrets:/secrets:ro
      - ./.fida-state:/state
    depends_on:
      playwright-server:
        condition: service_healthy
    expose: ["7070"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7070/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  playwright-server:
    image: ${PLAYWRIGHT_SERVER_IMAGE:?PLAYWRIGHT_SERVER_IMAGE is required}
    container_name: fida-playwright-server
    environment:
      FANDING_EMAIL: ${FANDING_EMAIL}
      FANDING_PASSWORD: ${FANDING_PASSWORD}
    security_opt:
      - seccomp:unconfined  # Chromium needs syscalls blocked by Docker default seccomp profile
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  caddy:
    image: caddy:2.9-alpine   # 버전 핀 — 무빙 태그 방지
    container_name: fida-caddy
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 64m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
