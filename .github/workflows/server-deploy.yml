name: Server Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force:
        description: 'fida 스케줄 실행 시간대 가드를 무시하고 강제 배포'
        required: false
        default: 'false'

permissions:
  contents: read
  packages: write

env:
  DEPLOY_PATH: /opt/fida

jobs:
  verify:
    name: Full Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - run: bash gradlew test

  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: verify
    outputs:
      fida_image: ${{ steps.image.outputs.fida_image }}
      fida_latest: ${{ steps.image.outputs.fida_latest }}
      playwright_image: ${{ steps.image.outputs.playwright_image }}
      playwright_latest: ${{ steps.image.outputs.playwright_latest }}
    steps:
      - uses: actions/checkout@v5

      - name: Set image names
        id: image
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "fida_image=${repo}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "fida_latest=${repo}:latest" >> "$GITHUB_OUTPUT"
          echo "playwright_image=${repo}-playwright-server:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "playwright_latest=${repo}-playwright-server:latest" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push fida image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ${{ steps.image.outputs.fida_image }}
            ${{ steps.image.outputs.fida_latest }}

      - name: Build and push playwright-server image
        uses: docker/build-push-action@v6
        with:
          context: ./playwright-server
          push: true
          platforms: linux/arm64
          tags: |
            ${{ steps.image.outputs.playwright_image }}
            ${{ steps.image.outputs.playwright_latest }}

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build
    concurrency: server-production
    environment:
      name: production
    steps:
      - name: fida 스케줄 실행 시간대 배포 가드 (KST)
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.force != 'true'
        run: |
          now=$((10#$(TZ=Asia/Seoul date +%H%M)))
          dow=$(TZ=Asia/Seoul date +%u)   # 1=월 ... 7=일
          blocked=no
          # fida 스케줄러 실행 구간: 화~토 06:50~07:30 KST (07:00 기동)
          if [ "$dow" -ge 2 ] && [ "$dow" -le 6 ] && [ "$now" -ge 650 ] && [ "$now" -le 730 ]; then blocked=yes; fi
          if [ "$blocked" = yes ]; then
            echo "::error::현재 KST $(TZ=Asia/Seoul date +%H:%M)는 fida 스케줄러 실행 시간대 — 배포가 실행 중인 스케줄 스레드를 강제 종료해 매매 기록 처리가 유실될 수 있어 차단합니다. 스케줄 종료 후 Actions에서 Re-run 하거나, 긴급 시 workflow_dispatch force=true로 강제 배포하세요."
            exit 1
          fi
          echo "fida 스케줄 실행 시간대 아님 (KST $(TZ=Asia/Seoul date +%H:%M)) — 배포 진행"

      - uses: actions/checkout@v5

      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT || '22' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SERVER_SSH_PORT" "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Upload deployment files
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SERVER_SSH_PORT" "$SERVER_USER@$SERVER_HOST" "mkdir -p '${DEPLOY_PATH}'"
          scp -i ~/.ssh/deploy_key -P "$SERVER_SSH_PORT" \
            deploy/server/docker-compose.yml \
            deploy/server/Caddyfile \
            "$SERVER_USER@$SERVER_HOST:${DEPLOY_PATH}/"

      - name: Deploy application
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT || '22' }}
          FIDA_IMAGE: ${{ needs.build.outputs.fida_image }}
          PLAYWRIGHT_SERVER_IMAGE: ${{ needs.build.outputs.playwright_image }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SERVER_SSH_PORT" "$SERVER_USER@$SERVER_HOST" \
            "DEPLOY_PATH='${DEPLOY_PATH}' FIDA_IMAGE='${FIDA_IMAGE}' PLAYWRIGHT_SERVER_IMAGE='${PLAYWRIGHT_SERVER_IMAGE}' GHCR_USERNAME='${GHCR_USERNAME}' GHCR_TOKEN='${GHCR_TOKEN}' bash -s" << 'ENDSSH'
            set -e
            cd "${DEPLOY_PATH}"

            # 현재 이미지 저장 (롤백용)
            PREV_FIDA_IMAGE=$(docker compose ps fida --format '{{.Image}}' 2>/dev/null || echo "")
            echo "$PREV_FIDA_IMAGE" > /tmp/fida-prev-image
            PREV_PLAYWRIGHT_IMAGE=$(docker compose ps playwright-server --format '{{.Image}}' 2>/dev/null || echo "")
            echo "$PREV_PLAYWRIGHT_IMAGE" > /tmp/fida-playwright-prev-image

            # GHCR 로그인 + fida/playwright-server만 배포 (caddy는 --no-deps로 제외 — routine 배포가 리버스 프록시를 건드리지 않도록)
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            export FIDA_IMAGE PLAYWRIGHT_SERVER_IMAGE
            docker compose pull
            docker compose up -d --no-deps fida playwright-server
            # caddy는 이미지 태그가 고정(caddy:2.9-alpine)이라 재생성되지 않고, 없으면 최초 생성됨 — 최초 배포 시 caddy가 영원히 안 뜨는 문제 방지
            docker compose up -d caddy
          ENDSSH

      - name: Health gate & auto-rollback
        if: always()
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SERVER_SSH_PORT" "$SERVER_USER@$SERVER_HOST" \
            "DEPLOY_PATH='${DEPLOY_PATH}' bash -s" << 'ENDSSH'
            set -e
            cd "${DEPLOY_PATH}"

            echo "헬스 게이트 시작 (최대 5분)..."
            for i in $(seq 1 30); do
              STATUS=$(docker inspect --format '{{.State.Health.Status}}' fida 2>/dev/null || echo "unknown")
              if [ "$STATUS" = "healthy" ]; then
                echo "✓ 헬스체크 통과 (${i}회 시도)"
                docker image prune -f || true
                exit 0
              fi
              if [ "$STATUS" = "unhealthy" ]; then
                echo "✗ 헬스체크 실패 (unhealthy, ${i}회 시도)"
                break
              fi
              echo "  대기 중... (${i}/30, 상태: ${STATUS})"
              sleep 10
            done

            # 헬스체크 실패 → 이전 이미지로 자동 롤백
            PREV_FIDA_IMAGE=$(cat /tmp/fida-prev-image 2>/dev/null || echo "")
            PREV_PLAYWRIGHT_IMAGE=$(cat /tmp/fida-playwright-prev-image 2>/dev/null || echo "")
            if [ -n "$PREV_FIDA_IMAGE" ] && [ -n "$PREV_PLAYWRIGHT_IMAGE" ]; then
              echo "✗ 헬스체크 실패 — 이전 이미지로 롤백: $PREV_FIDA_IMAGE / $PREV_PLAYWRIGHT_IMAGE"
              export FIDA_IMAGE="$PREV_FIDA_IMAGE"
              export PLAYWRIGHT_SERVER_IMAGE="$PREV_PLAYWRIGHT_IMAGE"
              docker compose up -d --no-deps fida playwright-server
            else
              echo "✗ 헬스체크 실패 — 이전 이미지 정보 없음, 수동 복구 필요"
            fi
            exit 1
          ENDSSH
