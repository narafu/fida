name: Server Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force:
        description: 'fida 스케줄 실행 시간대 가드(infra pre-apply hook)를 건너뛰고 강제 배포'
        required: false
        default: 'false'

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: Full Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - run: bash gradlew test

  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: verify
    outputs:
      fida_image: ${{ steps.image.outputs.fida_image }}
      fida_latest: ${{ steps.image.outputs.fida_latest }}
      playwright_image: ${{ steps.image.outputs.playwright_image }}
      playwright_latest: ${{ steps.image.outputs.playwright_latest }}
    steps:
      - uses: actions/checkout@v5

      - name: Set image names
        id: image
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "fida_image=${repo}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "fida_latest=${repo}:latest" >> "$GITHUB_OUTPUT"
          echo "playwright_image=${repo}-playwright-server:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "playwright_latest=${repo}-playwright-server:latest" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push fida image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ${{ steps.image.outputs.fida_image }}
            ${{ steps.image.outputs.fida_latest }}

      - name: Build and push playwright-server image
        uses: docker/build-push-action@v6
        with:
          context: ./playwright-server
          push: true
          platforms: linux/arm64
          tags: |
            ${{ steps.image.outputs.playwright_image }}
            ${{ steps.image.outputs.playwright_latest }}

  # 서버 적용은 kista-infra Reconcile App이 한다(검증·bundle·pre-apply hook·reconcile.sh 헬스 게이트·롤백·state 커밋).
  # 여기선 요청만 보내고 끝난다 — 결과는 infra가 이 커밋에 commit status `deploy/production`으로 되돌려 쓴다
  # 배포 금지 창(화~토 06:55~07:40 KST)은 deploy/hooks/pre-apply.sh가 infra 쪽에서 검사한다
  deploy:
    name: Deploy (kista-infra reconcile)
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
    steps:
      # kista-infra 전용 GitHub App의 1시간짜리 설치 토큰 — 장기 PAT 대신
      - name: kista-infra 앱 토큰
        id: infra-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.INFRA_APP_CLIENT_ID }}
          private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
          owner: narafu
          repositories: kista-infra
          permission-contents: write   # repository_dispatch
      # 두 이미지를 매 push 빌드하므로 config·role 모두 이 커밋. roles는 "role=sha" 공백 구분
      - name: dispatch
        env:
          GH_TOKEN: ${{ steps.infra-token.outputs.token }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force == 'true' }}
        run: |
          gh api repos/narafu/kista-infra/dispatches -f event_type=deploy \
            -f "client_payload[app]=fida" -f "client_payload[config]=$GITHUB_SHA" \
            -f "client_payload[roles]=playwright-server=$GITHUB_SHA fida=$GITHUB_SHA" -f "client_payload[sha]=$GITHUB_SHA" \
            -f "client_payload[force]=$FORCE"
